<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Teknik Gardu Induk sudah pindah</title>
    <meta http-equiv="refresh" content="0; url=https://dpanggabean220.github.io/kalkulator-gardu/">
    <style>
        body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
        a { font-size: 1.1rem; }
    </style>
</head>
<body>
    <h1>Aplikasi sudah pindah</h1>
    <p>Kalkulator Teknik Gardu Induk sekarang ada di alamat baru:</p>
    <p><a href="https://dpanggabean220.github.io/kalkulator-gardu/">dpanggabean220.github.io/kalkulator-gardu</a></p>
    <p>Kalau aplikasi sudah terpasang di HP, hapus ikon lama lalu pasang lagi dari alamat baru.</p>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
            });
        }
        if (window.caches) {
            caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
        }
        location.replace('https://dpanggabean220.github.io/kalkulator-gardu/');
    </script>
</body>
</html>
